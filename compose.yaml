services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: teco
      POSTGRES_USER: teco
      POSTGRES_PASSWORD: ${PGPASSWORD:-dev-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teco"]
      interval: 2s
      retries: 30
  web:
    build: .
    environment:
      PGHOST: db
      PGPASSWORD: ${PGPASSWORD:-dev-only}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-do-not-deploy}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
volumes:
  postgres_data:
