# Somente homologação. Banco Neon separado; não há contratação neste arquivo.
services:
  - type: web
    name: teco-nona-homologacao
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
