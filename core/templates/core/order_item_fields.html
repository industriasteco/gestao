<fieldset class="card form-grid order-item">
  <legend>Produto do pedido</legend>
  {{ item.non_field_errors }}
  <p>{{ item.product.label_tag }}<span class="entry-field-actions">{{ item.product }}{% if user.is_superuser %}<button type="button" class="secondary" data-quick-open="product">＋ Novo produto</button>{% endif %}</span>{{ item.product.errors }}</p>
  <p>{{ item.quantity.label_tag }}{{ item.quantity }}{{ item.quantity.errors }}</p>
</fieldset>
